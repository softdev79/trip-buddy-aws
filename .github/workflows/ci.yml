name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r requirements-dev.txt cfn-lint
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests (no LLM, no AWS)
        run: pytest -q tests
      - name: Lint CloudFormation
        run: cfn-lint infra/*.yaml

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [mcp_server, guide_agent, trip_buddy]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:ci .
