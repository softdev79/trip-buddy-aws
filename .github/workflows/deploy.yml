name: Deploy to AWS

# Manual only, so a push never starts paid infrastructure by surprise.
# Switch to `push: branches: [main]` once you want continuous deployment.
on:
  workflow_dispatch:
    inputs:
      env_name:
        description: Environment name (stack trip-buddy-<env>)
        default: dev
        required: true
      run_evals:
        description: Run the golden-question evals after deploying
        type: boolean
        default: true

permissions:
  id-token: write   # OIDC: exchange the GitHub token for short-lived AWS credentials
  contents: read

concurrency:
  group: deploy-${{ inputs.env_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env_name }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ENV_NAME: ${{ inputs.env_name }}
      IMAGE_TAG: ${{ github.sha }}
      CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build, push and deploy
        id: deploy
        run: bash scripts/deploy.sh

      - uses: actions/setup-python@v5
        if: inputs.run_evals
        with:
          python-version: "3.12"

      - name: Evals against the live deployment
        if: inputs.run_evals
        run: |
          pip install httpx
          python evals/run_evals.py "${{ steps.deploy.outputs.app_url }}"

      - name: Summary
        if: always()
        run: echo "### Trip Buddy (${ENV_NAME}) → ${{ steps.deploy.outputs.app_url }}" >> "$GITHUB_STEP_SUMMARY"
