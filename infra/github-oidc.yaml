AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap so GitHub Actions can deploy Trip Buddy without stored AWS keys.
  1. GitHubDeployRole  - assumed by workflows of ONE repository through OIDC. It can push
                         images to the trip-buddy-* ECR repositories and run CloudFormation,
                         nothing else.
  2. CfnExecutionRole  - passed to CloudFormation, which uses it to create the stack resources.
                         IAM changes are limited to roles named trip-buddy-*.

Parameters:
  GitHubRepo:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: owner/name of the GitHub repository allowed to deploy
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to "false" if this account already has the token.actions.githubusercontent.com provider

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1, 1c58a3a8518e8759bf075b76b750d4f2df264fcd]

  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trip-buddy-cfn-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: cloudformation.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"   # everything except IAM
      Policies:
        - PolicyName: ManageTripBuddyRolesOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/trip-buddy-*"
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringLike:
                    iam:AWSServiceName: [ecs.amazonaws.com, elasticloadbalancing.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: trip-buddy-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:*"
                  - !Join ["", ["repo:", !Select [0, !Split ["/", !Ref GitHubRepo]], "@*/", !Select [1, !Split ["/", !Ref GitHubRepo]], "@*:*"]]
      Policies:
        - PolicyName: DeployTripBuddy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:PutLifecyclePolicy
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/trip-buddy-*"
              - Effect: Allow
                Action: cloudformation:*
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/trip-buddy-*/*"
              - Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:ListServices]
                Resource: "*"

Outputs:
  GitHubDeployRoleArn:
    Description: Set as the GitHub repository variable AWS_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecutionRoleArn:
    Description: Set as the GitHub repository variable CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt CfnExecutionRole.Arn
